[package]
name = "plexus-agents"
version = "0.1.0"
edition = "2021"
description = "The agents service for Plexus: the Claude harness, the runtime and the agents activation"
license = "MIT"

[dependencies]
# Unpublished, so by local path for now. Everything else is a published crate.
plexus-harness = { path = "../plexus-harness" }
# SUPERCONDUCTOR-24: the Plexus 0.8 line, as plexus-ui 0.2.1 and menger take it:
# plexus-core 0.8.0, plexus-macros 0.8.1, plexus-transport 0.7.0 and
# plexus-auth-core 0.3.0 through the plexus-rpc umbrella (`plexus_rpc::core`,
# `::macros`, `::transport`, `::auth_core`), so one binary links one Plexus.
plexus-rpc = { version = "0.8.0", features = ["auth-adapters"] }
# SUPERCONDUCTOR-19: sign-in (WorkOS, key), sessions and the auth activation, as
# menger links it. 0.3 is the Plexus 0.8 line.
plexus-login = "0.3.1"
# SUPERCONDUCTOR-11: plexus-ui linked in-process, as menger links it (FRAME-7):
# the `ui` activation over its own `ui.db`, its seam, and the routes that serve
# the shell (`/`, `/app/...`) from the live bundle. The shell's base router and
# page policy are plexus-webapp's.
plexus-ui-service = "0.2.1"
plexus-webapp = "0.3.1"
anyhow = "1"
async-stream = "0.3"
# The one public port: the page, the sign-in routes, and the socket in front.
axum = { version = "0.8", features = ["ws"] }
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
futures = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros", "ws-client"] }
libc = "0.2"
# The pairing link as a QR code (TETHER-12's, lifted).
qrcode = { version = "0.14", default-features = false }
# 0.37: plexus-ui-service's, so one SQLite is linked.
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
# A host dials out on a socket of its own (SUPERCONDUCTOR-15). The version plexus-transport uses.
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
# SUPERCONDUCTOR-11: a bundle's tar, pushed in the shell's test.
tar = "0.4"
jsonwebtoken = "9"
rsa = "0.9"
rand = "0.8"
url = "2"
plexus-harness = { path = "../plexus-harness", features = ["conformance"] }

# SUPERCONDUCTOR-25: plexus-login with the allow list (`Allow`, `LoginOptions::allowing`),
# 0.3.1 plus that commit, unpublished: by path beside this checkout, as
# plexus-harness is (deploy/Dockerfile pins the commit).
[patch.crates-io]
plexus-login = { path = "../plexus-login" }
